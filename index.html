<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monalisa Interativa - Alura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Monalisa Interativa</h1>
        <div class="canvas-wrapper">
            <svg class="monalisa-canvas" viewBox="0 0 400 500" width="400" height="500">
                <!-- Fundo com cores originais da obra -->
                <defs>
                    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#a8996b;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8b7d5f;stop-opacity:1" />
                    </linearGradient>
                </defs>
                
                <!-- Fundo -->
                <rect width="400" height="500" fill="url(#bgGradient)"/>
                
                <!-- Paisagem ao fundo -->
                <ellipse cx="200" cy="350" rx="180" ry="80" fill="#7a9b6f" opacity="0.6"/>
                <path d="M 0 380 Q 100 350 200 360 T 400 380 L 400 500 L 0 500 Z" fill="#6b8b5f"/>
                
                <!-- Corpo e ombra -->
                <ellipse cx="200" cy="400" rx="90" ry="80" fill="#4a3f2f" opacity="0.7"/>
                <path d="M 140 350 Q 130 380 140 420 L 150 450 Q 150 480 200 480 Q 250 480 250 450 L 260 420 Q 270 380 260 350 Z" fill="#5a4f3f"/>
                
                <!-- Pescoço -->
                <ellipse cx="200" cy="280" rx="35" ry="50" fill="#d4a574"/>
                
                <!-- Cabeça -->
                <ellipse cx="200" cy="180" rx="80" ry="95" fill="#d4a574"/>
                
                <!-- Sombras faciais -->
                <ellipse cx="165" cy="200" rx="45" ry="60" fill="#c99563" opacity="0.4"/>
                
                <!-- Nariz -->
                <path d="M 200 140 L 195 180 L 200 190 L 205 180 Z" fill="#b8945f"/>
                
                <!-- Boca - sorriso famoso -->
                <path d="M 170 220 Q 200 240 230 220" stroke="#a8764f" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M 170 220 Q 200 235 230 220" fill="#c9956f" opacity="0.5"/>
                
                <!-- Olho esquerdo (base) -->
                <ellipse cx="170" cy="160" rx="18" ry="22" fill="#f5f5f0"/>
                <circle class="iris iris-left" cx="170" cy="165" r="10" fill="#6b4423"/>
                <circle class="pupil pupil-left" cx="170" cy="167" r="6" fill="#1a1410"/>
                <circle class="brilho brilho-left" cx="172" cy="164" r="2.5" fill="#ffffff"/>
                
                <!-- Olho direito (base) -->
                <ellipse cx="230" cy="160" rx="18" ry="22" fill="#f5f5f0"/>
                <circle class="iris iris-right" cx="230" cy="165" r="10" fill="#6b4423"/>
                <circle class="pupil pupil-right" cx="230" cy="167" r="6" fill="#1a1410"/>
                <circle class="brilho brilho-right" cx="232" cy="164" r="2.5" fill="#ffffff"/>
                
                <!-- Sobrancelhas -->
                <path d="M 150 140 Q 170 130 190 135" stroke="#6b4423" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M 210 135 Q 230 130 250 140" stroke="#6b4423" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                
                <!-- Cabelo -->
                <path d="M 120 140 Q 100 100 120 60 Q 150 20 200 15 Q 250 20 280 60 Q 300 100 280 140" fill="#4a3820" stroke="#3a2810" stroke-width="1"/>
                <path d="M 130 120 Q 110 95 125 55" stroke="#5a4830" stroke-width="2" fill="none" opacity="0.6"/>
                <path d="M 270 120 Q 290 95 275 55" stroke="#5a4830" stroke-width="2" fill="none" opacity="0.6"/>
                
                <!-- Mechas de cabelo -->
                <path d="M 160 40 Q 155 70 165 100" stroke="#3a2810" stroke-width="1.5" fill="none" opacity="0.4"/>
                <path d="M 240 40 Q 245 70 235 100" stroke="#3a2810" stroke-width="1.5" fill="none" opacity="0.4"/>
                
                <!-- Destaque nos olhos -->
                <circle cx="170" cy="155" r="6" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
                <circle cx="230" cy="155" r="6" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
            </svg>
        </div>
        <p class="info">Mova seu mouse sobre o rosto para ver os olhos acompanharem! 👀</p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
